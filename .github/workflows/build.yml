name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.CastCodecBlock -c Release

      - name: Package
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.CastCodecBlock/Jellyfin.Plugin.CastCodecBlock.csproj)
          ZIP=castcodecblock_${VERSION}.zip
          mkdir -p dist
          cp Jellyfin.Plugin.CastCodecBlock/bin/Release/net9.0/Jellyfin.Plugin.CastCodecBlock.dll dist/
          cp meta.json dist/
          (cd dist && zip ../$ZIP *)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: ${{ env.ZIP }}

      - name: Check tag matches AssemblyVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF_NAME#v}
          case "$VERSION" in "$TAG"|"$TAG".0) ;; *) echo "Tag $GITHUB_REF_NAME does not match AssemblyVersion $VERSION"; exit 1;; esac

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}

      - name: Update manifest.json on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git checkout main
          python3 .github/scripts/update_manifest.py "$ZIP" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: $VERSION" || exit 0
          git push origin main
