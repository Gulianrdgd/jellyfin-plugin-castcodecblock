name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['manifest.json', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.CastCodecBlock -c Release

      - name: Package
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.CastCodecBlock/Jellyfin.Plugin.CastCodecBlock.csproj)
          ZIP=castcodecblock_${VERSION}.zip
          mkdir -p dist
          cp Jellyfin.Plugin.CastCodecBlock/bin/Release/net9.0/Jellyfin.Plugin.CastCodecBlock.dll dist/
          cp meta.json dist/
          (cd dist && zip ../$ZIP *)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: ${{ env.ZIP }}

      - name: Check for existing release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSION
          echo "TAG=$TAG" >> $GITHUB_ENV
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, nothing to publish. Bump AssemblyVersion to release."
          else
            echo "PUBLISH=true" >> $GITHUB_ENV
          fi

      - name: Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ZIP }}

      - name: Update manifest.json on main
        if: env.PUBLISH == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 .github/scripts/update_manifest.py "$ZIP" "$VERSION" "$GITHUB_REPOSITORY" "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: $VERSION" || exit 0
          git push origin main
