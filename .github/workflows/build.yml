name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.CastCodecBlock -c Release

      - name: Package
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.CastCodecBlock/Jellyfin.Plugin.CastCodecBlock.csproj)
          DIR=CastCodecBlock_${VERSION}
          mkdir -p dist/$DIR
          cp Jellyfin.Plugin.CastCodecBlock/bin/Release/net9.0/Jellyfin.Plugin.CastCodecBlock.dll dist/$DIR/
          cp meta.json dist/$DIR/
          (cd dist && zip -r ../$DIR.zip $DIR)
          echo "ZIP=$DIR.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: ${{ env.ZIP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
